# CI：push master / PR 全量回归（ci-cd spec「持续集成检查」）。
# - Linux：cargo test --locked + cargo build --locked（本地全量 Check 的 CI 侧镜像）
# - Android：aarch64-linux-android 编译回归（移动目标可编译红线）
# cargo 一律 --locked（依赖白名单由 Cargo.lock 锁定，ADR-002/004）。
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支新 push 取消仍在跑的旧运行，以最新提交结果为准。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # never：保证日志无 ANSI 色码，失败摘要提取可稳定 grep。
  CARGO_TERM_COLOR: never
  # 钉版本 Tauri CLI（构建可复现性：不使用 latest / 裸主版本）。
  TAURI_CLI_VERSION: 2.11.4

jobs:
  test:
    name: Linux 全量回归（cargo test + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # tauri 在 Linux 编译需要 webkit2gtk 等系统依赖；gix/git2 的 https
      # 链路（openssl-sys）需要 libssl-dev + pkg-config（Windows 走 WinHTTP
      # 后端故本地未暴露）。
      - name: 系统依赖（webkit2gtk / openssl）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test --locked（含 golden 回归）
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee test.log

      - name: cargo build --locked
        run: |
          set -o pipefail
          cargo build --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee build.log

      - name: 失败摘要提取（Annotation）
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' test.log > test.log.clean 2>/dev/null || true
          sed -e 's/\x1b\[[0-9;]*m//g' build.log > build.log.clean 2>/dev/null || true
          enc() { sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-950; }
          msg=$(grep -h -A 12 -m 1 '^error' test.log.clean build.log.clean 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-950)
          if [ -n "$msg" ]; then echo "::error::Linux 回归首个错误块：%0A${msg}"; fi
          panics=$(grep -h -A 14 -m 2 -- '^---- .* stdout ----' test.log.clean build.log.clean 2>/dev/null | enc)
          if [ -n "$panics" ]; then echo "::error::失败测试 panic 块：%0A${panics}"; fi
          summary=$(grep -h -A 15 -m 1 '^failures:' test.log.clean 2>/dev/null | enc)
          if [ -n "$summary" ]; then echo "::error::failures 清单：%0A${summary}"; fi

      - name: 上传失败日志 artifact（ci-logs-linux）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-linux
          if-no-files-found: ignore
          path: |
            test.log
            build.log

  android-check:
    name: Android 目标编译回归（aarch64-linux-android）
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 Android NDK（钉版本）
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          ndk_home="$ANDROID_HOME/ndk/${NDK_VERSION}"
          {
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
            echo "NDK_HOME=$ndk_home"
            echo "ANDROID_NDK=$ndk_home"
            echo "CMAKE_TOOLCHAIN_FILE=$ndk_home/build/cmake/android.toolchain.cmake"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-linux-android

      # aws-lc-sys / vendored openssl / libgit2 的 C 交叉编译全部经 NDK clang。
      - name: cargo check --target aarch64-linux-android --locked
        run: |
          set -o pipefail
          cargo check --target aarch64-linux-android --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee android-check.log

      # 排障闭环：仓库私有、无 API 权限时，把首个错误块（含 build script
      # stderr）提升为 Annotations，Actions 页面免翻日志即可定位失败原因。
      - name: 失败摘要提取（Annotation）
        if: failure()
        run: |
          echo "NDK=$ANDROID_NDK_HOME"
          sed -e 's/\x1b\[[0-9;]*m//g' android-check.log > android-check.log.clean
          echo '--- first error block ---'
          grep -A 40 -m 1 '^error' android-check.log.clean || true
          echo '--- build script stderr ---'
          grep -A 20 -m 1 -- '--- stderr' android-check.log.clean || true
          enc() { sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-950; }
          msg=$(grep -A 12 -m 1 '^error' android-check.log.clean | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-950)
          if [ -n "$msg" ]; then echo "::error::Android check 首个错误块：%0A${msg}"; fi
          stderr=$(grep -A 30 -m 1 -- '--- stderr' android-check.log.clean | enc)
          if [ -n "$stderr" ]; then echo "::error::build script stderr：%0A${stderr}"; fi
          tailmsg=$(tail -n 25 android-check.log.clean | enc)
          if [ -n "$tailmsg" ]; then echo "::error::日志尾 25 行：%0A${tailmsg}"; fi

      - name: 上传失败日志 artifact（ci-logs-android）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-android
          if-no-files-found: ignore
          path: android-check.log
