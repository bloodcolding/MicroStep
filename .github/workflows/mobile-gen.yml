# 一次性移动工程脚手架（手动触发）。
# 本仓库纪律：移动构建工程（src-tauri/gen/android、src-tauri/gen/apple）入库、
# CI 与 release.yml 运行时零生成（ci-cd spec「移动工程随源码演进」）。
# 本工作流仅供「生成一次 → 下载 artifact → 以源码提交入库」的脚手架场景
# （例如本机无 Android SDK/NDK 或 Xcode 时），不属于 CI/发布路径。
name: Mobile project scaffolding (one-time)

on:
  workflow_dispatch:

env:
  TAURI_CLI_VERSION: 2.11.4

jobs:
  android:
    name: 生成 src-tauri/gen/android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装 Android NDK（钉版本）
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          ndk_home="$ANDROID_HOME/ndk/${NDK_VERSION}"
          {
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
            echo "NDK_HOME=$ndk_home"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: tauri android init（一次性脚手架，产物回传入库）
        run: npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" android init --ci --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: gen-android
          if-no-files-found: error
          path: src-tauri/gen/android/

  apple:
    name: 生成 src-tauri/gen/apple
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: tauri ios init（一次性脚手架，产物回传入库）
        run: npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" ios init --ci --manifest-path src-tauri/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: gen-apple
          if-no-files-found: error
          path: src-tauri/gen/apple/
