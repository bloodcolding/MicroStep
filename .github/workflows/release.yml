# 发布：仅 tag v* 触发（ci-cd spec「发布触发与版本守卫」）。
# guard → 五平台并行构建 → draft Release 聚合（人工确认后才 publish）。
# 全部 cargo 调用经 `-- --locked` 透传锁定依赖；Tauri CLI 钉完整版本号。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.11.4

jobs:
  guard:
    name: 版本守卫（tag 与 tauri.conf.json 强一致）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 严格字符串相等，预发布号合法（v0.2.1-rc1 ↔ 0.2.1-rc1）；
      # 失败则 fail-fast，全部构建作业因 needs 被跳过，不消耗构建资源。
      - name: 校验 tag 与 tauri.conf.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "tag=v${TAG} / tauri.conf.json.version=${CONF}"
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::tag v${TAG} 与 tauri.conf.json version ${CONF} 不一致：先 bump 版本（tauri.conf.json + Cargo.toml + Cargo.lock）再打同名 tag"
            exit 1
          fi

  windows:
    name: Windows x64（NSIS + MSI）
    needs: guard
    if: ${{ false }} # iOS 调通后恢复（TC-R01 全量五平台在正式 tag 重验）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # MSI 的 ProductVersion 不支持非数字 pre-release（WiX 硬约束）：
      # 预发布号（如 0.2.1-rc1）只出 NSIS，正式版才附 MSI。
      - name: Tauri build（NSIS；正式版附加 MSI）
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $bundles = if ($ver -match '-') { 'nsis' } else { 'nsis,msi' }
          Write-Output "version=$ver bundles=$bundles"
          npx -y "@tauri-apps/cli@${env:TAURI_CLI_VERSION}" build --bundles $bundles --ci -- --locked

      - name: SHA256 校验和
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          shopt -s nullglob
          files=(nsis/*.exe msi/*.msi)
          sha256sum "${files[@]}" > checksums-windows.txt
          cat checksums-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/checksums-windows.txt

  macos:
    name: macOS universal（DMG）
    needs: guard
    if: ${{ false }} # iOS 调通后恢复
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tauri build（universal 单 dmg 双架构）
        run: npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --target universal-apple-darwin --bundles dmg --ci -- --locked

      - name: SHA256 校验和
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle
          shasum -a 256 dmg/*.dmg > checksums-macos.txt
          cat checksums-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/checksums-macos.txt

  linux:
    name: Linux（deb + rpm + AppImage）
    needs: guard
    if: ${{ false }} # iOS 调通后恢复
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 系统依赖（webkit2gtk 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev cmake pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ubuntu-22.04 退役时回退 ubuntu-latest（glibc 兼容性记录于 design D3）。
      - name: Tauri build（deb/rpm/AppImage）
        run: npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --bundles deb,rpm,appimage --ci -- --locked

      - name: SHA256 校验和
        run: |
          cd src-tauri/target/release/bundle
          sha256sum deb/*.deb rpm/*.rpm appimage/*.AppImage > checksums-linux.txt
          cat checksums-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/checksums-linux.txt

  android:
    name: Android（aarch64 + x86_64 签名 APK）
    needs: guard
    if: ${{ false }} # iOS 调通后恢复
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: 安装 Android NDK（钉版本）
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          ndk_home="$ANDROID_HOME/ndk/${NDK_VERSION}"
          if [ ! -d "$ndk_home" ]; then
            echo "::error::NDK ${NDK_VERSION} 未安装（${ndk_home} 不存在），实际已装："
            ls "$ANDROID_HOME/ndk" 2>/dev/null || true
            exit 1
          fi
          bin="$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin"
          arm_clang="$bin/aarch64-linux-android24-clang"
          x86_clang="$bin/x86_64-linux-android24-clang"
          if [ ! -x "$arm_clang" ] || [ ! -x "$x86_clang" ]; then
            echo "::error::NDK clang wrapper 缺失（arm64=${arm_clang} / x64=${x86_clang}）"
            exit 1
          fi
          {
            echo "ANDROID_NDK_HOME=$ndk_home"
            echo "ANDROID_NDK_ROOT=$ndk_home"
            echo "NDK_HOME=$ndk_home"
            echo "ANDROID_NDK=$ndk_home"
            echo "CMAKE_TOOLCHAIN_FILE=$ndk_home/build/cmake/android.toolchain.cmake"
            echo "CC_aarch64_linux_android=$arm_clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$arm_clang"
            echo "CC_x86_64_linux_android=$x86_clang"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$x86_clang"
          } >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-apk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Secrets 缺失必须显式失败，禁止静默产出未签名/debug 包。
      - name: 校验签名 Secrets 齐备
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::缺少 GitHub Secret: $v（keystore 由 keytool 本地生成，四项均需配置）"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      # keystore 仅经 Secrets 注入：解码到 runner 临时目录 + 生成 keystore.properties，
      # 两者都不入库（仓库内 gen/android 只有 gradle 工程与签名配置引用）。
      - name: 注入签名配置（keystore.properties，运行时生成）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"
          cd src-tauri/gen/android
          {
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "password=${ANDROID_KEY_PASSWORD}"
            echo "storeFile=${RUNNER_TEMP}/release.keystore"
          } > keystore.properties

      - name: Tauri android build（双 ABI release APK）
        run: npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" android build --apk --target aarch64 x86_64 --ci -- --locked

      - name: 验证 APK 签名（apksigner）
        run: |
          apksigner="$(echo "$ANDROID_HOME"/build-tools/*/apksigner | head -n1 | awk '{print $1}')"
          find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | while read -r apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      - name: SHA256 校验和
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk
          find . -name '*release*.apk' -exec sha256sum {} + > "$RUNNER_TEMP/checksums-android.txt"
          cp "$RUNNER_TEMP/checksums-android.txt" checksums-android.txt
          cat checksums-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*release*.apk
            src-tauri/gen/android/app/build/outputs/apk/checksums-android.txt

  ios:
    name: iOS（未签名 ipa，debugging 导出）
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: aarch64-apple-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零证书导出：IDEDistribution（-exportArchive）强制要求 team（哪怕
      # method=debugging 也报 No Team Found in Archive），无 Apple 账号走不通
      # → 直接 xcodebuild 出未签名 .app，再手工打 Payload zip（未签名 ipa 的
      # 本质）；用户侧经爱思助手 / Sideloadly 免费 Apple ID 自签（7 天时效）。
      - name: xcodebuild 未签名 .app + 手工打 ipa
        run: |
          cd src-tauri/gen/apple
          xcodebuild -workspace microstep.xcodeproj/project.xcworkspace \
            -scheme microstep_iOS -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          ver=$(jq -r .version ../../tauri.conf.json)
          app="build/Build/Products/Release-iphoneos/MicroStep.app"
          out="build/ios/iphoneos"
          mkdir -p "$out/Payload"
          cp -R "$app" "$out/Payload/"
          (cd "$out" && zip -qry "Microstep_${ver}_unsigned.ipa" Payload)
          rm -rf "$out/Payload"

      - name: SHA256 校验和
        run: |
          cd src-tauri/gen/apple/build/ios/iphoneos
          shasum -a 256 *.ipa > checksums-ios.txt
          cat checksums-ios.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          if-no-files-found: error
          path: |
            src-tauri/gen/apple/build/ios/iphoneos/*.ipa
            src-tauri/gen/apple/build/ios/iphoneos/checksums-ios.txt

  release:
    name: Draft Release 聚合（人工确认后发布）
    needs: [guard, windows, macos, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 产物清单
        run: ls -lR dist

      # 保持 draft，不自动 publish；任一构建失败则本作业不执行（无残缺 Release）。
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/**
          body: |
            ## 产物清单

            - Windows x64：NSIS setup `.exe` + `.msi`
            - macOS universal：单 `.dmg`（Intel + Apple Silicon）
            - Linux：`.deb` + `.rpm` + `.AppImage`
            - Android：aarch64 / x86_64 双 ABI **已签名** release APK
            - iOS：`debugging` 导出的**未签名** `.ipa`

            各 `checksums-*.txt` 为对应产物 SHA256，下载后请本地校验。

            ## iOS 安装说明（未签名包）

            iOS 包无签名，需在电脑上用爱思助手或 Sideloadly 以免费 Apple ID
            自签后侧载（7 天有效期，到期连接电脑重签约 30 秒，应用数据保留）。
