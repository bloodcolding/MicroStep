<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title data-i18n="app.title">MicroStep · 个人成长 RPG</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">⚡</span>
          <div>
            <h1>MicroStep</h1>
            <p data-i18n="brand.tagline">反内卷个人成长引擎</p>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="todayLabel" class="today-label"></span>
          <button id="awakenTopBtn" class="ghost-button" type="button" data-i18n="topbar.awaken">立即觉醒</button>
          <button id="refreshBtn" class="ghost-button" type="button" data-i18n="topbar.refresh">刷新状态</button>
          <button id="localeToggle" class="ghost-button" type="button" data-i18n-aria-label="topbar.locale.aria">EN</button>
          <button id="settingsBtn" class="ghost-button" type="button" data-i18n="topbar.settings">⚙ 设置</button>
        </div>
      </header>

      <main class="shell">
        <section id="simpleView" class="view simple-view">
          <div class="hero-card card">
            <div class="hero-copy">
              <p class="eyebrow" data-i18n="simple.eyebrow">DAY 1 · 初见期</p>
              <h2><span data-i18n="simple.heading1">只定义 Task，</span><br /><span data-i18n="simple.heading2">不制造打卡焦虑。</span></h2>
              <p class="muted" data-i18n="simple.sub">自己设置属性与数值，系统按你的定义结算。</p>
            </div>
            <div class="hero-gauges">
              <div class="gauge-block">
                <div class="gauge-label"><span data-i18n="simple.sanLabel">🧠 SAN</span><strong id="simpleSanValue">100</strong></div>
                <div class="bar"><span id="simpleSanBar" class="bar-fill san"></span></div>
                <p id="simpleSanHint" class="gauge-hint"></p>
              </div>
              <div class="hero-actions">
                <button id="simpleNewTaskBtn" class="primary-button" type="button" data-i18n="simple.newTask">新建 Task</button>
              </div>
            </div>
          </div>

          <section class="card">
            <div class="section-head">
              <h3 data-i18n="simple.recentEvents">最近事件流</h3>
              <span class="muted" data-i18n="simple.eventsSub">事件溯源 · 不可变日志</span>
            </div>
            <div id="simpleEvents" class="event-list"></div>
          </section>
        </section>

        <section id="dashboardView" class="view dashboard-view" hidden>
          <div class="dashboard-grid">
            <div class="left-column">
              <div class="card">
                <div class="section-head">
                  <h3 data-i18n="dash.epics">🏁 里程碑</h3>
                  <button id="newEpicBtn" class="text-button" type="button" data-i18n="dash.newEpic">新建里程碑</button>
                </div>
                <div class="task-toolbar two-column">
                  <input id="epicSearchInput" class="search-input" type="search" data-i18n-placeholder="dash.epicSearchPh" placeholder="搜索里程碑名称、描述、属性或状态" />
                  <span id="epicCount" class="muted"></span>
                </div>
                <div id="epicList" class="stack-list epic-list"></div>
                <div class="sub-section-head">
                  <h4 data-i18n="dash.taskList">Task 列表</h4>
                  <button id="newTaskBtn" class="text-button" type="button" data-i18n="dash.newTask">新建 Task</button>
                </div>
                <div class="task-toolbar">
                  <input id="taskSearchInput" class="search-input" type="search" data-i18n-placeholder="dash.taskSearchPh" placeholder="搜索 Task 名称、属性、数值或里程碑" />
                  <label class="filter-toggle">
                    <input id="showCompletedTasks" type="checkbox" />
                    <span data-i18n="dash.showCompleted">显示已完成</span>
                  </label>
                  <span id="taskCount" class="muted"></span>
                </div>
                <div id="taskList" class="task-list"></div>
              </div>

              <div class="card">
                <div class="section-head">
                  <h3 data-i18n="dash.recentEvents">📜 最近事件流</h3>
                  <div class="head-actions">
                    <span class="muted">append-only log</span>
                  </div>
                </div>
                <div id="dashboardEvents" class="event-list"></div>
              </div>
            </div>

            <div class="right-column">
              <div class="card stat-hero">
                <div class="gauge-block">
                <div class="gauge-label"><span data-i18n="dash.sanLabel">🧠 SAN / 理智</span><strong id="sanValue">100</strong></div>
                  <div class="bar"><span id="sanBar" class="bar-fill san"></span></div>
                  <p id="sanHint" class="gauge-hint"></p>
                </div>
              </div>

              <div class="card">
                <div class="section-head">
                  <h3 data-i18n="dash.radar">属性雷达</h3>
                  <span class="muted" data-i18n="dash.radarSub">渐进式觉醒</span>
                </div>
                <canvas id="radarCanvas" width="520" height="460"></canvas>
              </div>

              <div class="card">
                <div class="section-head">
                  <h3 data-i18n="dash.dimensions">属性值</h3>
                </div>
                <div id="dimensionCards" class="dimension-grid"></div>
              </div>

              <div class="card">
                <div class="section-head">
                  <h3 data-i18n="dash.titles">🏅 里程碑称号</h3>
                  <span class="muted" data-i18n="dash.titlesSub">3 个激活插槽</span>
                </div>
                <div id="equipmentSlots" class="equipment-slots"></div>
                <div id="titleLibrary" class="title-library"></div>
              </div>

            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" hidden></div>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-card">
        <button class="modal-close" data-close-modal type="button">×</button>
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/settings.js"></script>
  </body>
</html>
