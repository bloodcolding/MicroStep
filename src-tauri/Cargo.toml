[package]
name = "microstep"
version = "0.2.0"
edition = "2021"
description = "MicroStep 2.0 · Tauri v2 桌面应用（领域核心为 Python 版行为等价移植）"
default-run = "microstep"

[lib]
name = "microstep"
path = "src/lib.rs"

[[bin]]
name = "microstep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地时区真实时钟（等价 Python date.today/now_iso；经用户批准统一引入，ADR-002 口径）
chrono = "0.4"
# Ticker 周期任务（Python 后台线程的 tokio 等价，design D5）
tokio = { version = "1", features = ["time", "macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
