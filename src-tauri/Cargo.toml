[package]
name = "microstep"
version = "0.2.1-rc4"
edition = "2021"
description = "MicroStep 2.0 · Tauri v2 桌面应用（领域核心为 Python 版行为等价移植）"
default-run = "microstep"

[lib]
name = "microstep_lib"
path = "src/lib.rs"
# 移动端必需：cdylib 出 libmicrostep.so（Android）/ staticlib 出 libapp.a（iOS），
# rlib 供桌面 bin 链接（tauri 移动模板标准三件套）。
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "microstep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地时区真实时钟（等价 Python date.today/now_iso；经用户批准统一引入，ADR-002 口径）
chrono = "0.4"
# Ticker 周期任务（Python 后台线程的 tokio 等价，design D5）；rt 为测试所需
tokio = { version = "1", features = ["time", "macros", "rt"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Git 远端同步（add-git-remote-sync，D1：push 走 git2-rs libgit2 进程内绑定；
# 集成测试亦以其构造本地 bare repo 夹具）。ADR-004 随实现落账。
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "https"] }
# gix 最小 feature 集：HTTPS 传输（reqwest+rusttls）+ sha1 对象哈希（git 默认，
# 无它 gix-hash 零臂 match 无法编译）；ADR-004 随实现落账。
gix = { version = "0.87.1", default-features = false, features = ["blocking-http-transport-reqwest-rust-tls", "sha1"] }

# Android/iOS 无系统 OpenSSL；macOS runner 的 brew openssl@3 为 keg-only 且
# pkg-config 默认不可见：libgit2 https 链路（openssl-sys）在这些目标必须
# vendored 源码编译（ERR-002 路线 A，ADR-005）。Windows 图中无 openssl
# （libgit2 走 WinHTTP），Linux 桌面继续用系统 libssl-dev，均不受影响。
[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

# Android TLS 信任根（ADR-008）：gix→reqwest 0.13 的 rustls 特性唯一验证器是
# rustls-platform-verifier，其 Android 后端需 JNI 初始化 + Kotlin 组件。
# 两 crate 均为锁内既有传递依赖（gix 引入），此处仅声明为直依赖以便调用，
# 不新增任何传递依赖。
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[profile.release]
strip = true
lto = true
